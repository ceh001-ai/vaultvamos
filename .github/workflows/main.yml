name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Vault OS" "com.vaultos.app" --web-dir dist
          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode Archive (Unsigned / Ad-Hoc IPA)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath ../../build/VaultOS.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          cd ../..
          mkdir -p build/Payload
          cp -r build/VaultOS.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r VaultOS.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultOS-iOS-IPA
          path: build/VaultOS.ipa
